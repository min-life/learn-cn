,["他是老师，她呢？","Tā shì lǎo shī, tā ne?","Anh ấy là giáo viên, còn cô ấy?"]],"n":["Lưu ý: cần có câu trước làm ngữ cảnh. 呢 đọc thanh nhẹ."]}],"3":[{"t":"这 / 那 · Này, đây / Kia, đó","r":"<b>这 (zhè)</b> chỉ vật hoặc người ở gần, <b>那 (nà)</b> chỉ vật hoặc người ở xa.","f":[["Cấu trúc","这 / 那 + 是 + 名词"],["Câu hỏi","这 / 那 + 是 + 名词 + 吗？"]],"ex":[["这是我的书。","Zhè shì wǒ de shū.","Đây là sách của tôi."],["那是词典。","Nà shì cí diǎn.","Kia là từ điển."],["这是汉语课本吗？","Zhè shì Hàn yǔ kè běn ma?","Đây là sách giáo khoa tiếng Hán à?"],["那不是杂志。","Nà bú shì zá zhì.","Kia không phải tạp chí."]],"n":["Lưu ý: trong khẩu ngữ 这, 那 thường đọc là zhèi, nèi. Sách dùng zhè, nà."]},{"t":"特殊疑问句 · Câu hỏi dùng từ nghi vấn","r":"Dùng từ nghi vấn <b>什么 (gì), 谁 (ai), 哪 (nào)</b> thay vào đúng chỗ cần hỏi. Trật tự câu giữ như câu trần thuật.","f":[["Cấu trúc","Thay phần cần hỏi bằng từ nghi vấn"]],"ex":[["这是什么书？","Zhè shì shén me shū?","Đây là sách gì?"],["那是谁？","Nà shì shéi?","Kia là ai?"],["她是哪国人？","Tā shì nǎ guó rén?","Cô ấy là người nước nào?"],["你叫什么名字？","Nǐ jiào shén me míng zi?","Bạn tên là gì?"]],"n":["Lưu ý: câu hỏi có từ nghi vấn không thêm 吗 ở cuối."]},{"t":"定语 · Định ngữ (dùng 的)","r":"Thành phần đứng trước danh từ để bổ nghĩa cho nó gọi là định ngữ. Với sở hữu, dùng <b>的 (de)</b> nối định ngữ và danh từ.","f":[["Cấu trúc","定语 + 的 + 名词"]],"ex":[["我的书","wǒ de shū","sách của tôi"],["老师的词典","lǎo shī de cí diǎn","từ điển của thầy cô"],["汉语课本","Hàn yǔ kè běn","sách giáo khoa tiếng Hán"],["我的朋友","wǒ de péng you","bạn của tôi"]],"n":["Lưu ý: định ngữ chỉ loại hoặc tính chất (như 汉语课本) thường không cần 的. Với người thân thiết, khẩu ngữ có thể bỏ 的 (我朋友)."]}],"4":[{"t":"在 / 是 · Biểu thị vị trí","r":"Có hai cấu trúc nói về vị trí. Biết sự vật rồi nói nó <b>ở đâu</b> thì dùng 在. Biết vị trí rồi nói <b>ở đó là gì</b> thì dùng 是.","f":[["Cấu trúc 1","名词 + 在 + 处所 (X ở …)"],["Cấu trúc 2","处所 + 是 + 名词 (… là X)"]],"ex":[["图书馆在那儿。","Tú shū guǎn zài nàr.","Thư viện ở kia."],["那儿是宿舍楼。","Nàr shì sù shè lóu.","Chỗ kia là tòa nhà ký túc xá."],["我的书在这儿。","Wǒ de shū zài zhèr.","Sách của tôi ở đây."]],"n":["Lưu ý: 这儿 (zhèr) là ở đây, 那儿 (nàr) là ở kia."]},{"t":"哪儿 · Ở đâu","r":"<b>哪儿 (nǎr)</b> dùng để hỏi nơi chốn. Đặt đúng vị trí của chỗ cần hỏi, không thêm 吗.","f":[["Cấu trúc","名词 + 在 + 哪儿？"]],"ex":[["图书馆在哪儿？","Tú shū guǎn zài nǎr?","Thư viện ở đâu?"],["你的宿舍在哪儿？","Nǐ de sù shè zài nǎr?","Ký túc xá của bạn ở đâu?"],["请问，教学楼在哪儿？","Qǐng wèn, jiào xué lóu zài nǎr?","Xin hỏi, tòa nhà dạy học ở đâu?"]],"n":["Trả lời: 在这儿 / 在那儿 (ở đây / ở kia)."]},{"t":"方位名词(1) · Từ chỉ phương vị","r":"<b>东, 西, 南, 北</b> (đông, tây, nam, bắc) và 左, 右 (trái, phải) ghép với <b>边 (biān)</b> để chỉ phương hướng: 东边, 西边, 南边, 北边, 左边, 右边.","f":[["Cấu trúc","A + 在 + B + 的 + 方位词 (A ở phía … của B)"]],"ex":[["图书馆在教学楼的北边。","Tú shū guǎn zài jiào xué lóu de běi bian.","Thư viện ở phía bắc tòa nhà dạy học."],["宿舍在图书馆的左边。","Sù shè zài tú shū guǎn de zuǒ bian.","Ký túc xá ở bên trái thư viện."],["日本在中国的东边。","Rì běn zài Zhōng guó de dōng bian.","Nhật Bản ở phía đông Trung Quốc."]],"n":["Lưu ý: nơi làm mốc (B) đứng trước, từ phương vị đứng sau."]}],"5":[{"t":"Tổng kết ngữ pháp đơn nguyên 1 (bài 1 đến bài 4)","r":"Ôn nhanh các điểm ngữ pháp của bài 1 đến bài 4. Mỗi điểm có một câu mẫu.","f":[],"ex":[["她是学生。","Tā shì xué sheng.","Cô ấy là học sinh. (câu chữ 是)"],["你是老师吗？","Nǐ shì lǎo shī ma?","Bạn là giáo viên à? (câu hỏi dùng 吗)"],["我们是同学。","Wǒ men shì tóng xué.","Chúng tôi là bạn học. (们)"],["他也是留学生。","Tā yě shì liú xué shēng.","Anh ấy cũng là lưu học sinh. (也)"],["我是学生，你呢？","Wǒ shì xué sheng, nǐ ne?","Tôi là học sinh, còn bạn? (呢)"],["这是词典，那是杂志。","Zhè shì cí diǎn, nà shì zá zhì.","Đây là từ điển, kia là tạp chí. (这/那)"],["她是哪国人？","Tā shì nǎ guó rén?","Cô ấy là người nước nào? (từ nghi vấn)"],["这是我的书。","Zhè shì wǒ de shū.","Đây là sách của tôi. (定语 的)"],["图书馆在那儿。","Tú shū guǎn zài nàr.","Thư viện ở kia. (在/是, 哪儿)"],["宿舍在图书馆的北边。","Sù shè zài tú shū guǎn de běi bian.","Ký túc xá ở phía bắc thư viện. (方位名词)"]],"n":["Bài 5 là bài ôn: học sinh dùng các cấu trúc trên để giới thiệu bản thân và hỏi đường trong trường."]}],"6":[{"t":"钟点表达法 · Cách nói giờ","r":"Giờ: số + <b>点 (diǎn)</b>. Phút: số + <b>分 (fēn)</b>. 15 phút là <b>一刻 (yí kè)</b>, 30 phút là <b>半 (bàn)</b>, kém là <b>差 (chà)</b>.","f":[["Giờ chẵn","数字 + 点"],["Giờ và phút","数字 + 点 + 数字 + 分"],["Rưỡi","… 点半"],["Kém","差 + 分钟 / 一刻 + 点"]],"ex":[["八点","bā diǎn","8 giờ"],["八点十分","bā diǎn shí fēn","8 giờ 10 phút"],["八点半","bā diǎn bàn","8 giờ rưỡi"],["八点一刻","bā diǎn yí kè","8 giờ 15"],["差十分九点","chà shí fēn jiǔ diǎn","9 giờ kém 10 (8:50)"],["现在几点？","Xiàn zài jǐ diǎn?","Bây giờ mấy giờ?"]],"n":["Lưu ý: phút từ 1 đến 9 thì thêm 零: 8:05 là 八点零五分."]},{"t":"数字表达法 · Cách nói số","r":"Số 1 đến 10: 一, 二, 三, 四, 五, 六, 七, 八, 九, 十. Từ 11 trở lên ghép từ các số này.","f":[["11 đến 19","十 + 个位数"],["20 đến 99","十位数 + 十 + 个位数"]],"ex":[["十二","shí èr","12"],["二十","èr shí","20"],["二十五","èr shí wǔ","25"],["五十","wǔ shí","50"],["九十九","jiǔ shí jiǔ","99"]],"n":["Lưu ý: số 11 đến 19 không thêm 一 trước 十 (nói 十一, không nói 一十一)."]}],"7":[{"t":"“有”字句 · Câu chữ “有”","r":"<b>有 (yǒu)</b> biểu thị sở hữu hoặc tồn tại. Phủ định dùng <b>没有 (méi yǒu)</b>, không dùng 不有.","f":[["Khẳng định","主语 + 有 + 名词"],["Phủ định","主语 + 没(有) + 名词"],["Nghi vấn","主语 + 有 + 名词 + 吗？"]],"ex":[["我有汉语课本。","Wǒ yǒu Hàn yǔ kè běn.","Tôi có sách giáo khoa tiếng Hán."],["他没有自行车。","Tā méi yǒu zì xíng chē.","Anh ấy không có xe đạp."],["明天你有课吗？","Míng tiān nǐ yǒu kè ma?","Ngày mai bạn có tiết không?"]],"n":["Lưu ý: phủ định của 有 là 没有, không phải 不有."]},{"t":"吧(1) · Phỏng đoán, xác nhận","r":"<b>吧 (ba)</b> ở cuối câu trần thuật cho biết người nói đã đoán như vậy và muốn xác nhận: “chắc là … phải không?”.","f":[["Cấu trúc","陈述句 + 吧？"]],"ex":[["你有自行车吧？","Nǐ yǒu zì xíng chē ba?","Bạn có xe đạp, phải không?"],["你是留学生吧？","Nǐ shì liú xué shēng ba?","Bạn là lưu học sinh, đúng không?"],["他是老师吧？","Tā shì lǎo shī ba?","Anh ấy chắc là giáo viên nhỉ?"]],"n":["Lưu ý: 吗 dùng khi chưa biết gì, 吧 dùng khi đã có phán đoán và chỉ cần xác nhận."]},{"t":"方位名词(2) · Từ chỉ phương vị (tiếp)","r":"Ghép 上, 下, 前, 后, 里, 外 với <b>边 (biān)</b> hoặc 面 để chỉ vị trí: 上边 (phía trên), 下边 (phía dưới), 前边 (phía trước), 后边 (phía sau), 里边 (bên trong), 外边 (bên ngoài).","f":[["Cấu trúc","名词 + 在 + 处所 + 方位词"]],"ex":[["车在楼下车棚里。","Chē zài lóu xià chē péng lǐ.","Xe ở trong nhà để xe dưới tòa nhà."],["我的书在宿舍里。","Wǒ de shū zài sù shè lǐ.","Sách của tôi ở trong ký túc xá."],["图书馆在教学楼后边。","Tú shū guǎn zài jiào xué lóu hòu bian.","Thư viện ở phía sau tòa nhà dạy học."]],"n":["Lưu ý: 楼上 (trên lầu) và 楼下 (dưới lầu) là cách nói rất hay dùng."]},{"t":"时间名词做状语 · Từ chỉ thời gian làm trạng ngữ","r":"Từ chỉ thời gian như <b>今天, 明天, 上午, 晚上</b> đứng sau chủ ngữ hoặc đầu câu, trước động từ, cho biết hành động xảy ra khi nào.","f":[["Cấu trúc","主语 + 时间 + 动词 / 时间 + 主语 + 动词"]],"ex":[["我明天有课。","Wǒ míng tiān yǒu kè.","Ngày mai tôi có tiết."],["今天晚上你有时间吗？","Jīn tiān wǎn shang nǐ yǒu shí jiān ma?","Tối nay bạn có thời gian không?"],["他上午去图书馆。","Tā shàng wǔ qù tú shū guǎn.","Buổi sáng anh ấy đi thư viện."]],"n":["Lưu ý: từ chỉ thời gian đứng trước động từ."]}],"8":[{"t":"吧(2) · Đề nghị, mời gọi","r":"<b>吧 (ba)</b> ở cuối câu cầu khiến để đề nghị, mời hoặc giục: “nhé, đi, thôi”.","f":[["Cấu trúc","祈使句 + 吧"]],"ex":[["来我们学校玩儿吧！","Lái wǒ men xué xiào wánr ba!","Đến trường chúng tôi chơi nhé!"],["我们走吧。","Wǒ men zǒu ba.","Chúng ta đi thôi."],["你等一下吧。","Nǐ děng yí xià ba.","Bạn đợi một chút nhé."]],"n":["Lưu ý: khác với 吧(1) ở bài 7 (phỏng đoán), đây là 吧 đề nghị."]},{"t":"呢(2) · Làm mềm câu hỏi","r":"<b>呢 (ne)</b> đặt cuối câu hỏi có từ nghi vấn để giọng hỏi nhẹ nhàng, tự nhiên hơn.","f":[["Cấu trúc","特殊疑问句 + 呢？"]],"ex":[["去你们学校怎么走呢？","Qù nǐ men xué xiào zěn me zǒu ne?","Đến trường các bạn đi thế nào?"],["你的宿舍在哪儿呢？","Nǐ de sù shè zài nǎr ne?","Ký túc xá của bạn ở đâu vậy?"],["他是谁呢？","Tā shì shéi ne?","Anh ấy là ai vậy?"]],"n":["Lưu ý: 呢 và 吗 không dùng cùng nhau."]},{"t":"号码表达法 · Cách đọc dãy số","r":"Số điện thoại, số phòng, số nhà đọc <b>từng chữ số một</b>. Số 0 đọc là 零 (líng). Số 1 trong dãy số thường đọc là <b>yāo</b> (viết 幺) để không nhầm với 七 (qī).","f":[["Cấu trúc","Đọc lần lượt từng chữ số"]],"ex":[["我的房间号是三〇五。","Wǒ de fáng jiān hào shì sān líng wǔ.","Số phòng của tôi là 305."],["我的手机号码是幺三八零五二幺六七八九。","Wǒ de shǒu jī hào mǎ shì yāo sān bā líng wǔ èr yāo liù qī bā jiǔ.","Số di động của tôi là 138 0521 6789."],["我的宿舍是东五号楼。","Wǒ de sù shè shì dōng wǔ hào lóu.","Ký túc xá của tôi là tòa số 5 khu Đông."]],"n":["Lưu ý: khi viết dùng số 1, khi đọc dãy số thường nói yāo."]},{"t":"“几”和“多少”(1) · Hỏi số lượng","r":"<b>几 (jǐ)</b> thường hỏi số nhỏ (dưới 10). <b>多少 (duō shao)</b> hỏi số bất kỳ, thường dùng khi số có thể lớn.","f":[["Với 几","几 + 量词 / 名词"],["Với 多少","多少 + (量词) + 名词"]],"ex":[["你的房间号是多少？","Nǐ de fáng jiān hào shì duō shao?","Số phòng của bạn là bao nhiêu?"],["你的电话号码是多少？","Nǐ de diàn huà hào mǎ shì duō shao?","Số điện thoại của bạn là bao nhiêu?"],["现在几点？","Xiàn zài jǐ diǎn?","Bây giờ mấy giờ?"]],"n":["Lưu ý: hỏi giờ, ngày, thứ thường dùng 几 (几点, 几号)."]}],"9":[{"t":"“几”和“多少”(2) · Hỏi số lượng (tiếp)","r":"<b>几 + 量词 + 名词</b> hỏi số lượng nhỏ (dưới 10). <b>多少 + (量词) + 名词</b> hỏi số lượng lớn hơn hoặc chưa biết nhiều ít, lượng từ sau 多少 có thể lược bỏ.","f":[["Với 几","几 + 量词 + 名词"],["Với 多少","多少 + 名词"]],"ex":[["你买几瓶水？","Nǐ mǎi jǐ píng shuǐ?","Bạn mua mấy chai nước?"],["一本词典多少钱？","Yì běn cí diǎn duō shao qián?","Một quyển từ điển bao nhiêu tiền?"],["你们学校有多少老师？","Nǐ men xué xiào yǒu duō shao lǎo shī?","Trường các bạn có bao nhiêu giáo viên?"]],"n":["Lưu ý: sau 几 phải có lượng từ (几个, 几本), sau 多少 thì không bắt buộc."]},{"t":"“二”和“两” · Hai","r":"Khi đếm số, đọc số thứ tự hoặc dãy số dùng <b>二 (èr)</b>. Trước lượng từ dùng <b>两 (liǎng)</b>. Với 200 và 2000 dùng 二百 / 两百, 二千 / 两千 đều được.","f":[["Dùng 二","十二, 二十, 二十二, 第二, 二号楼"],["Dùng 两","两 + 量词: 两本, 两块, 两瓶"]],"ex":[["我买两瓶水。","Wǒ mǎi liǎng píng shuǐ.","Tôi mua hai chai nước."],["二号楼","èr hào lóu","tòa số 2"],["两块钱","liǎng kuài qián","hai đồng"],["二十二","èr shí èr","22"]],"n":["Lưu ý: 二 ở hàng đơn vị hoặc hàng chục của số luôn đọc là 二, không đọc 两."]},{"t":"量词 · Lượng từ","r":"Giữa số từ (hoặc 这, 那, 几) và danh từ cần có <b>lượng từ</b>.","f":[["Cấu trúc","数词 + 量词 + 名词"]],"ex":[["一本书","yì běn shū","một quyển sách"],["两瓶水","liǎng píng shuǐ","hai chai nước"],["三块钱","sān kuài qián","ba đồng"],["这个人","zhè ge rén","người này"]],"n":["Lưu ý: 个 (gè) là lượng từ dùng rộng nhất. Mỗi danh từ còn có lượng từ riêng, như 本 cho sách, 瓶 cho chai."]},{"t":"钱数表达法 · Cách nói tiền","r":"Đơn vị tiền Trung Quốc: <b>元 (yuán)</b> trong văn viết, <b>块 (kuài)</b> trong khẩu ngữ. Dưới đó là <b>角 (jiǎo)</b>, khẩu ngữ <b>毛 (máo)</b>. 1 块 = 10 毛.","f":[["Khẩu ngữ","… 块 … 毛 (钱)"],["Văn viết","… 元 … 角"]],"ex":[["九块四毛","jiǔ kuài sì máo","9 đồng 4 hào"],["三块五","sān kuài wǔ","3 đồng 5 hào"],["一共二十块。","Yí gòng èr shí kuài.","Tổng cộng 20 đồng."],["一瓶水多少钱？","Yì píng shuǐ duō shao qián?","Một chai nước bao nhiêu tiền?"]],"n":["Lưu ý: đơn vị cuối cùng thường lược bỏ: 三块五 là 3 đồng 5 hào."]}],"10":[{"t":"Tổng kết ngữ pháp đơn nguyên 2 (bài 6 đến bài 9)","r":"Ôn nhanh các điểm ngữ pháp của bài 6 đến bài 9. Mỗi điểm có một câu mẫu.","f":[],"ex":[["现在八点半。","Xiàn zài bā diǎn bàn.","Bây giờ là 8 giờ rưỡi. (cách nói giờ)"],["他今年二十五岁。","Tā jīn nián èr shí wǔ suì.","Năm nay anh ấy 25 tuổi. (cách nói số)"],["明天你有课吗？","Míng tiān nǐ yǒu kè ma?","Ngày mai bạn có tiết không? (有)"],["你有自行车吧？","Nǐ yǒu zì xíng chē ba?","Bạn có xe đạp, phải không? (吧 phỏng đoán)"],["车在楼下车棚里。","Chē zài lóu xià chē péng lǐ.","Xe ở trong nhà để xe dưới lầu. (phương vị)"],["今天晚上你有时间吗？","Jīn tiān wǎn shang nǐ yǒu shí jiān ma?","Tối nay bạn có thời gian không? (thời gian làm trạng ngữ)"],["来我们学校玩儿吧！","Lái wǒ men xué xiào wánr ba!","Đến trường chúng tôi chơi nhé! (吧 đề nghị)"],["去你们学校怎么走呢？","Qù nǐ men xué xiào zěn me zǒu ne?","Đến trường các bạn đi thế nào? (呢)"],["我的房间号是三〇五。","Wǒ de fáng jiān hào shì sān líng wǔ.","Số phòng của tôi là 305. (đọc dãy số)"],["你买几瓶？一本词典多少钱？","Nǐ mǎi jǐ píng? Yì běn cí diǎn duō shao qián?","Bạn mua mấy chai? Một quyển từ điển bao nhiêu tiền? (几/多少)"],["两瓶啤酒七块。","Liǎng píng pí jiǔ qī kuài.","Hai chai bia bảy đồng. (二/两, lượng từ, tiền)"]],"n":["Bài 10 là bài ôn: học sinh dùng các cấu trúc trên để hỏi giờ, hỏi số điện thoại và mua đồ."]}],"11":[{"t":"怎么样 · Thế nào?","r":"<b>怎么样 (zěn me yàng)</b> dùng để hỏi tình hình, tính chất hoặc xin ý kiến: “thế nào?”.","f":[["Hỏi tình hình","主语 + 怎么样？"],["Xin ý kiến","……，怎么样？"]],"ex":[["北京的冬天怎么样？","Běi jīng de dōng tiān zěn me yàng?","Mùa đông ở Bắc Kinh thế nào?"],["今天天气怎么样？","Jīn tiān tiān qì zěn me yàng?","Hôm nay thời tiết thế nào?"],["我们明天去，怎么样？","Wǒ men míng tiān qù, zěn me yàng?","Ngày mai chúng ta đi, được không?"]],"n":["Lưu ý: không thêm 吗 sau 怎么样."]},{"t":"不A不B · Không … không …","r":"Cấu trúc <b>不 + A + 不 + B</b>, trong đó A và B là hai tính từ trái nghĩa, diễn tả mức độ vừa phải.","f":[["Cấu trúc","不 + 形容词A + 不 + 形容词B"]],"ex":[["不冷不热","bù lěng bú rè","không lạnh không nóng"],["不大不小","bú dà bù xiǎo","không to không nhỏ"],["不多不少","bù duō bù shǎo","không nhiều không ít"],["北京的秋天不冷不热，很舒服。","Běi jīng de qiū tiān bù lěng bú rè, hěn shū fu.","Mùa thu Bắc Kinh không lạnh không nóng, rất dễ chịu."]],"n":["Lưu ý phát âm: 不 đọc là bú khi đứng trước âm tiết thanh 4 (bú rè, bú dà)."]},{"t":"形容词谓语句 · Tính từ làm vị ngữ","r":"Tính từ có thể làm vị ngữ trực tiếp, <b>không cần 是</b>. Thường có phó từ như 很 đứng trước. Phủ định dùng 不.","f":[["Khẳng định","主语 + 很 + 形容词"],["Phủ định","主语 + 不 + 形容词"]],"ex":[["冬天很冷。","Dōng tiān hěn lěng.","Mùa đông rất lạnh."],["夏天很热。","Xià tiān hěn rè.","Mùa hè rất nóng."],["春天不冷。","Chūn tiān bù lěng.","Mùa xuân không lạnh."],["这儿的风景很美。","Zhèr de fēng jǐng hěn měi.","Phong cảnh ở đây rất đẹp."]],"n":["Lưu ý: không nói 今天是很冷. 很 trong câu này thường chỉ mang nghĩa nhẹ, không nhấn mạnh “rất”."]}],"12":[{"t":"(正在/在)……呢 · Đang làm gì","r":"Dùng <b>正在</b>, <b>在</b> hoặc <b>呢</b> ở cuối câu (dùng một hoặc kết hợp) để diễn tả hành động đang diễn ra.","f":[["Cấu trúc","主语 + (正)在 + 动词 + (宾语) + 呢"],["Phủ định","主语 + 没(有)在 + 动词"]],"ex":[["你在干什么呢？","Nǐ zài gàn shén me ne?","Bạn đang làm gì thế?"],["我在做作业呢。","Wǒ zài zuò zuò yè ne.","Tôi đang làm bài tập."],["他们正在喝咖啡呢。","Tā men zhèng zài hē kā fēi ne.","Họ đang uống cà phê."],["他在看书呢。","Tā zài kàn shū ne.","Anh ấy đang đọc sách."]],"n":["Lưu ý: 在, 正在, 呢 có thể dùng riêng lẻ, không bắt buộc đủ cả ba."]},{"t":"每……都…… · Mỗi … đều …","r":"<b>每 (měi) + lượng từ/danh từ + 都 (dōu) + động từ</b>: nhấn mạnh cái nào cũng như vậy.","f":[["Cấu trúc","每 + 量词 / 时间 + (主语) + 都 + 动词"]],"ex":[["我每天都做作业。","Wǒ měi tiān dōu zuò zuò yè.","Mỗi ngày tôi đều làm bài tập."],["每个星期三我都有课。","Měi ge xīng qī sān wǒ dōu yǒu kè.","Thứ tư nào tôi cũng có tiết."],["他每天都去图书馆。","Tā měi tiān dōu qù tú shū guǎn.","Mỗi ngày anh ấy đều đến thư viện."]],"n":["Lưu ý: 都 đứng sau chủ ngữ, trước động từ."]},{"t":"星期的表达法 · Cách nói thứ trong tuần","r":"Thứ trong tuần: <b>星期 + số</b>. Chủ nhật là 星期天 hoặc 星期日. Hỏi: 星期几？","f":[["Thứ hai đến thứ bảy","星期一, 星期二, 星期三, 星期四, 星期五, 星期六"],["Chủ nhật","星期天 / 星期日"],["Hỏi","星期几？"]],"ex":[["今天星期几？","Jīn tiān xīng qī jǐ?","Hôm nay thứ mấy?"],["今天星期三。","Jīn tiān xīng qī sān.","Hôm nay thứ tư."],["明天星期天。","Míng tiān xīng qī tiān.","Ngày mai chủ nhật."],["星期六我不上课。","Xīng qī liù wǒ bú shàng kè.","Thứ bảy tôi không có tiết."]],"n":["Lưu ý: 星期一 là thứ hai, 星期二 là thứ ba, và cứ thế đến 星期六 là thứ bảy. Không có 星期七."]},{"t":"从……到…… · Từ … đến …","r":"Chỉ điểm bắt đầu và điểm kết thúc của thời gian hoặc địa điểm: “từ … đến …”.","f":[["Cấu trúc","从 + 起点 + 到 + 终点"]],"ex":[["从星期一到星期五我都有课。","Cóng xīng qī yī dào xīng qī wǔ wǒ dōu yǒu kè.","Từ thứ hai đến thứ sáu tôi đều có tiết."],["我从八点到十二点上课。","Wǒ cóng bā diǎn dào shí èr diǎn shàng kè.","Tôi học từ 8 giờ đến 12 giờ."],["从星期一到星期三，他都在图书馆。","Cóng xīng qī yī dào xīng qī sān, tā dōu zài tú shū guǎn.","Từ thứ hai đến thứ tư, anh ấy đều ở thư viện."]],"n":["Lưu ý: cụm 从……到…… thường đứng trước động từ."]}],"13":[{"t":"连动句 · Câu liên động","r":"Câu có hai hay nhiều động từ đi liền nhau cho cùng một chủ ngữ, thường theo thứ tự hành động xảy ra. Rất hay gặp: <b>去/来 + nơi chốn + động từ</b> (đi đâu để làm gì).","f":[["Cấu trúc","主语 + 动词1 + (宾语1) + 动词2 + (宾语2)"]],"ex":[["我去图书馆借书。","Wǒ qù tú shū guǎn jiè shū.","Tôi đến thư viện mượn sách."],["他去商店买衣服。","Tā qù shāng diàn mǎi yī fu.","Anh ấy đi cửa hàng mua quần áo."],["她去银行换钱。","Tā qù yín háng huàn qián.","Cô ấy đi ngân hàng đổi tiền."]],"n":["Lưu ý: giữa hai động từ không có từ nối như 和; thứ tự động từ theo thứ tự hành động xảy ra."]},{"t":"先……，然后…… · Trước …, sau đó …","r":"<b>先 (xiān) … 然后 (rán hòu) …</b> nêu thứ tự của hai hành động.","f":[["Cấu trúc","先 + 动词1，然后 + 动词2"]],"ex":[["我先去银行，然后去商店。","Wǒ xiān qù yín háng, rán hòu qù shāng diàn.","Tôi đến ngân hàng trước, sau đó đến cửa hàng."],["你先做作业，然后看电视。","Nǐ xiān zuò zuò yè, rán hòu kàn diàn shì.","Bạn làm bài tập trước, sau đó xem ti vi."],["他先去图书馆借书，然后回宿舍。","Tā xiān qù tú shū guǎn jiè shū, rán hòu huí sù shè.","Anh ấy đến thư viện mượn sách trước, rồi về ký túc xá."]],"n":["Lưu ý: 然后 có thể dùng cùng 再 ở khẩu ngữ, sẽ gặp ở bài sau."]},{"t":"“咱们”和“我们” · Chúng ta và chúng tôi","r":"<b>我们 (wǒ men)</b> chỉ nhóm của người nói, có thể không gồm người nghe. <b>咱们 (zán men)</b> luôn gồm cả người nghe: “chúng ta”.","f":[["我们","chúng tôi / chúng ta (không nhất thiết gồm người nghe)"],["咱们","chúng ta (gồm cả người nghe)"]],"ex":[["我们明天去商店，你呢？","Wǒ men míng tiān qù shāng diàn, nǐ ne?","Ngày mai chúng tôi đi cửa hàng, còn bạn?"],["咱们明天一起去商店，好不好？","Zán men míng tiān yì qǐ qù shāng diàn, hǎo bu hǎo?","Ngày mai chúng ta cùng đi cửa hàng, được không?"]],"n":["Lưu ý: 咱们 thường dùng ở miền Bắc, mang sắc thái thân mật."]},{"t":"“A不A”和“V不V” · Câu hỏi chính phản","r":"Lặp lại tính từ hoặc động từ và chèn 不 ở giữa để hỏi “có … không?”. Không thêm 吗.","f":[["Tính từ","主语 + 形容词 + 不 + 形容词？"],["Động từ","主语 + 动词 + 不 + 动词 + (宾语)？"]],"ex":[["那儿的东西贵不贵？","Nàr de dōng xi guì bu guì?","Đồ ở đó có đắt không?"],["你去不去商店？","Nǐ qù bu qù shāng diàn?","Bạn có đi cửa hàng không?"],["好不好？","Hǎo bu hǎo?","Được không?"]],"n":["Lưu ý: 不 ở giữa đọc thanh nhẹ (bu). Không dùng 吗 cùng với câu hỏi chính phản."]}],"14":[{"t":"挺 + adj. · Khá, rất","r":"<b>挺 (tǐng) + tính từ</b>: “khá, rất”, mức độ khá cao, thường đi với <b>的</b> ở cuối câu trong khẩu ngữ.","f":[["Cấu trúc","挺 + 形容词 (+ 的)"]],"ex":[["这件毛衣挺好看的。","Zhè jiàn máo yī tǐng hǎo kàn de.","Chiếc áo len này khá đẹp."],["北京的冬天挺冷的。","Běi jīng de dōng tiān tǐng lěng de.","Mùa đông Bắc Kinh khá lạnh."],["学生宿舍挺小的。","Xué sheng sù shè tǐng xiǎo de.","Ký túc xá sinh viên khá nhỏ."]],"n":["Lưu ý: phủ định không dùng 不挺, dùng 不太 (không … lắm)."]},{"t":"“的”字词组 · Cụm từ chữ “的”","r":"<b>X + 的</b> (X là đại từ, danh từ, tính từ hoặc động từ) có chức năng như một danh từ. Dùng khi danh từ phía sau đã rõ nghĩa nên lược đi.","f":[["Cấu trúc","X + 的 (= X + 的 + 名词)"]],"ex":[["我喜欢浅颜色的。","Wǒ xǐ huan qiǎn yán sè de.","Tôi thích loại màu nhạt."],["白的容易脏。","Bái de róng yì zāng.","Màu trắng dễ bẩn."],["这件是我的。","Zhè jiàn shì wǒ de.","Cái này là của tôi."],["你喜欢蓝的吗？","Nǐ xǐ huan lán de ma?","Bạn thích cái màu xanh lam không?"]],"n":["Lưu ý: chỉ dùng khi người nghe biết rõ danh từ bị lược là gì."]},{"t":"有(一)点儿 · Hơi …","r":"<b>有(一)点儿 + tính từ</b>: “hơi …”, thường mang sắc thái không hài lòng hoặc tiêu cực.","f":[["Cấu trúc","主语 + 有(一)点儿 + 形容词"]],"ex":[["这件毛衣有点儿贵。","Zhè jiàn máo yī yǒu diǎnr guì.","Chiếc áo len này hơi đắt."],["这个颜色有点儿深。","Zhè ge yán sè yǒu diǎnr shēn.","Màu này hơi đậm."],["今天有点儿冷。","Jīn tiān yǒu diǎnr lěng.","Hôm nay hơi lạnh."]],"n":["Lưu ý: khác với 一点儿 đứng sau tính từ khi đề nghị thay đổi, như 便宜一点儿 (rẻ hơn một chút)."]}],"15":[{"t":"Tổng kết ngữ pháp đơn nguyên 3 (bài 11 đến bài 14)","r":"Ôn nhanh các điểm ngữ pháp của bài 11 đến bài 14. Mỗi điểm có một câu mẫu.","f":[],"ex":[["今天天气怎么样？","Jīn tiān tiān qì zěn me yàng?","Hôm nay thời tiết thế nào? (怎么样)"],["北京的秋天不冷不热。","Běi jīng de qiū tiān bù lěng bú rè.","Mùa thu Bắc Kinh không lạnh không nóng. (不A不B)"],["冬天很冷。","Dōng tiān hěn lěng.","Mùa đông rất lạnh. (tính từ làm vị ngữ)"],["我在做作业呢。","Wǒ zài zuò zuò yè ne.","Tôi đang làm bài tập. (在……呢)"],["我每天都有课。","Wǒ měi tiān dōu yǒu kè.","Mỗi ngày tôi đều có tiết. (每……都……)"],["今天星期三。","Jīn tiān xīng qī sān.","Hôm nay thứ tư. (星期)"],["从星期一到星期五我都有课。","Cóng xīng qī yī dào xīng qī wǔ wǒ dōu yǒu kè.","Từ thứ hai đến thứ sáu tôi đều có tiết. (从……到……)"],["我去图书馆借书。","Wǒ qù tú shū guǎn jiè shū.","Tôi đến thư viện mượn sách. (连动句)"],["我先去银行，然后去商店。","Wǒ xiān qù yín háng, rán hòu qù shāng diàn.","Tôi đến ngân hàng trước, sau đó đến cửa hàng. (先……然后……)"],["咱们一起去，你去不去？","Zán men yì qǐ qù, nǐ qù bu qù?","Chúng ta cùng đi, bạn có đi không? (咱们, V不V)"],["这件毛衣挺好看的。","Zhè jiàn máo yī tǐng hǎo kàn de.","Chiếc áo len này khá đẹp. (挺……的)"],["白的容易脏，我喜欢蓝的。","Bái de róng yì zāng, wǒ xǐ huan lán de.","Màu trắng dễ bẩn, tôi thích màu xanh lam. (“的”字词组)"],["这件有点儿贵。","Zhè jiàn yǒu diǎnr guì.","Chiếc này hơi đắt. (有点儿)"]],"n":["Bài 15 là bài ôn: học sinh dùng các cấu trúc trên để nói về thời tiết, lịch học và mua sắm."]}],"16":[{"t":"太……了 · Quá …","r":"<b>太 (tài) + tính từ + 了</b>: “quá …”, thường biểu thị cảm thán hoặc mức độ quá cao.","f":[["Cấu trúc","太 + 形容词 + 了"]],"ex":[["太高兴了！","Tài gāo xìng le!","Vui quá!"],["今天太冷了。","Jīn tiān tài lěng le.","Hôm nay lạnh quá."],["这个房间太小了。","Zhè ge fáng jiān tài xiǎo le.","Căn phòng này nhỏ quá."]],"n":["Lưu ý: phủ định dùng 不太 + tính từ (không … lắm), không nói 不太……了."]},{"t":"动词重叠 · Động từ lặp lại","r":"Lặp lại động từ để diễn tả hành động nhẹ nhàng, thoải mái, thử làm hoặc trong thời gian ngắn. Âm tiết lặp lại đọc thanh nhẹ.","f":[["Đơn âm tiết","看 → 看看, 看一看"],["Song âm tiết","休息 → 休息休息"]],"ex":[["我们去商店逛逛吧。","Wǒ men qù shāng diàn guàng guang ba.","Chúng ta đi cửa hàng dạo một chút nhé."],["你来看看。","Nǐ lái kàn kan.","Bạn đến xem thử."],["休息休息吧。","Xiū xi xiū xi ba.","Nghỉ ngơi một chút đi."]],"n":["Lưu ý: động từ lặp lại không dùng cùng 在 / 正在 (đang)."]},{"t":"地点状语 · Trạng ngữ nơi chốn","r":"Từ chỉ nơi chốn đứng <b>trước động từ</b>, thường dùng giới từ <b>在 (ở)</b>.","f":[["Cấu trúc","主语 + 在 + 处所 + 动词 + 宾语"]],"ex":[["我在宿舍看电视。","Wǒ zài sù shè kàn diàn shì.","Tôi xem ti vi ở ký túc xá."],["他在图书馆看书。","Tā zài tú shū guǎn kàn shū.","Anh ấy đọc sách ở thư viện."],["我们在商店买东西。","Wǒ men zài shāng diàn mǎi dōng xi.","Chúng tôi mua đồ ở cửa hàng."]],"n":["Lưu ý: nơi chốn đứng trước động từ, khác với cách nói tiếng Việt “xem ti vi ở ký túc xá”."]}],"17":[{"t":"(是)A还是B · A hay là B","r":"Câu hỏi lựa chọn: <b>A 还是 B</b> nghĩa là “A hay là B?”. Chữ 是 ở đầu có thể lược. Người trả lời chọn một trong hai.","f":[["Cấu trúc","(是) A + 还是 + B？"]],"ex":[["你喝茶还是喝咖啡？","Nǐ hē chá hái shi hē kā fēi?","Bạn uống trà hay uống cà phê?"],["你是老师还是学生？","Nǐ shì lǎo shī hái shi xué sheng?","Bạn là giáo viên hay học sinh?"],["我们坐地铁还是打车？","Wǒ men zuò dì tiě hái shi dǎ chē?","Chúng ta đi tàu điện ngầm hay đi taxi?"]],"n":["Lưu ý: không thêm 吗 vào cuối câu hỏi có 还是."]},{"t":"就是 · Chính là","r":"<b>就是 (jiù shì)</b> nhấn mạnh đối tượng được xác định: “chính là …”.","f":[["Cấu trúc","A + 就是 + B"]],"ex":[["我最喜欢吃的就是饺子。","Wǒ zuì xǐ huan chī de jiù shì jiǎo zi.","Món tôi thích ăn nhất chính là sủi cảo."],["这就是我的宿舍。","Zhè jiù shì wǒ de sù shè.","Đây chính là ký túc xá của tôi."],["他就是我的老师。","Tā jiù shì wǒ de lǎo shī.","Ông ấy chính là thầy của tôi."]],"n":["Lưu ý: so với 是, 就是 mang sắc thái nhấn mạnh “chính là”."]},{"t":"会(1) · Biết (làm gì)","r":"<b>会 (huì)</b> là động từ năng nguyện, chỉ năng lực có được nhờ học tập: “biết làm gì”.","f":[["Khẳng định","主语 + 会 + 动词"],["Phủ định","主语 + 不会 + 动词"],["Nghi vấn","主语 + 会 + 动词 + 吗？"]],"ex":[["我会说汉语。","Wǒ huì shuō Hàn yǔ.","Tôi biết nói tiếng Hán."],["他不会包饺子。","Tā bú huì bāo jiǎo zi.","Anh ấy không biết gói sủi cảo."],["你会写汉字吗？","Nǐ huì xiě Hàn zì ma?","Bạn có biết viết chữ Hán không?"]],"n":["Lưu ý: 会 ở bài này chỉ năng lực. 会(2) ở bài 29 còn có nghĩa “sẽ”."]}],"18":[{"t":"列举 · Liệt kê","r":"Dùng <b>啦 (la)</b> sau mỗi mục khi liệt kê để nêu vài ví dụ tiêu biểu: A啦，B啦，C啦……","f":[["Cấu trúc","A 啦，B 啦，C 啦，…… 都 / 等等"]],"ex":[["周末啦，放假啦，我都睡懒觉。","Zhōu mò la, fàng jià la, wǒ dōu shuì lǎn jiào.","Cuối tuần này, nghỉ lễ này, tôi đều ngủ nướng."],["看书啦，听音乐啦，他都喜欢。","Kàn shū la, tīng yīn yuè la, tā dōu xǐ huan.","Đọc sách này, nghe nhạc này, anh ấy đều thích."]],"n":["Lưu ý: vế cuối thường có 都 để tóm tắt."]},{"t":"得(děi) · Phải","r":"<b>得 (děi)</b> là động từ năng nguyện: “phải, cần phải”, biểu thị sự cần thiết.","f":[["Khẳng định","主语 + 得 + 动词"],["Phủ định","主语 + 不用 + 动词"]],"ex":[["我得回宿舍了。","Wǒ děi huí sù shè le.","Tôi phải về ký túc xá rồi."],["你得多休息。","Nǐ děi duō xiū xi.","Bạn phải nghỉ ngơi nhiều."],["明天上午有课，我得八点到。","Míng tiān shàng wǔ yǒu kè, wǒ děi bā diǎn dào.","Sáng mai có tiết, tôi phải đến lúc 8 giờ."]],"n":["Lưu ý: 得 ở đây đọc děi, khác với 得 (de) trợ từ. Phủ định dùng 不用, không dùng 不得."]},{"t":"反问句(1) · Câu hỏi tu từ","r":"Dùng <b>不是……吗？</b> để nhấn mạnh điều đã biết: “chẳng phải … sao?”. Người hỏi không cần câu trả lời.","f":[["Cấu trúc","不是 + …… + 吗？"]],"ex":[["你不是留学生吗？","Nǐ bú shì liú xué shēng ma?","Chẳng phải bạn là lưu học sinh sao?"],["他不是你的同屋吗？","Tā bú shì nǐ de tóng wū ma?","Chẳng phải anh ấy là bạn cùng phòng của bạn sao?"],["这不是你的书吗？","Zhè bú shì nǐ de shū ma?","Đây chẳng phải sách của bạn sao?"]],"n":["Lưu ý: câu hỏi tu từ mang nghĩa khẳng định (đúng là …) và thường thể hiện ngạc nhiên hoặc nhắc nhở."]},{"t":"如果……（的话），就…… · Nếu … thì …","r":"<b>如果 (rú guǒ) … (的话)，就 …</b> nghĩa là “nếu … thì …”. 如果 và 的话 có thể lược bớt một trong hai.","f":[["Cấu trúc","如果 + 条件 (+ 的话)，就 + 结果"]],"ex":[["如果明天不下雨，我们就去。","Rú guǒ míng tiān bú xià yǔ, wǒ men jiù qù.","Nếu ngày mai không mưa thì chúng ta đi."],["如果你有时间的话，就来我家玩儿吧。","Rú guǒ nǐ yǒu shí jiān de huà, jiù lái wǒ jiā wánr ba.","Nếu bạn có thời gian thì đến nhà tôi chơi nhé."],["你想吃的话，就买吧。","Nǐ xiǎng chī de huà, jiù mǎi ba.","Nếu bạn muốn ăn thì mua đi."]],"n":["Lưu ý: 就 đứng trước động từ ở vế sau, không đứng trước chủ ngữ."]}],"19":[{"t":"了(1) · Trợ từ 了 cuối câu","r":"<b>了 (le)</b> đặt cuối câu khẳng định một việc đã xảy ra hoặc một tình trạng đã thay đổi. Phủ định dùng <b>没(有)</b> và bỏ 了.","f":[["Khẳng định","主语 + 动词 + 宾语 + 了"],["Phủ định","主语 + 没(有) + 动词 + 宾语"]],"ex":[["他去图书馆了。","Tā qù tú shū guǎn le.","Anh ấy đã đi thư viện rồi."],["昨天下雪了。","Zuó tiān xià xuě le.","Hôm qua có tuyết rơi."],["我已经习惯了。","Wǒ yǐ jīng xí guàn le.","Tôi đã quen rồi."],["他没去图书馆。","Tā méi qù tú shū guǎn.","Anh ấy không đi thư viện."]],"n":["Lưu ý: khi phủ định bỏ 了, dùng 没(有) trước động từ."]},{"t":"还 · Vẫn, còn","r":"<b>还 (hái)</b> biểu thị trạng thái chưa thay đổi (vẫn, còn) hoặc bổ sung thêm (còn, thêm nữa).","f":[["Trạng thái chưa đổi","还 + 动词 / 形容词"],["Bổ sung","……，还有 / 还 + 动词"]],"ex":[["现在还早。","Xiàn zài hái zǎo.","Bây giờ vẫn còn sớm."],["他还没起床。","Tā hái méi qǐ chuáng.","Anh ấy vẫn chưa ngủ dậy."],["我家有爸爸、妈妈，还有一个弟弟。","Wǒ jiā yǒu bà ba, mā ma, hái yǒu yí ge dì di.","Nhà tôi có bố, mẹ và còn một em trai."]],"n":["Lưu ý: dạng 还没(有)…… nghĩa là “vẫn chưa …”."]},{"t":"“就”和“才” · Đã … và Mới …","r":"<b>就 (jiù)</b> cho thấy sự việc xảy ra sớm, nhanh, dễ dàng. <b>才 (cái)</b> cho thấy sự việc xảy ra muộn, chậm, khó khăn.","f":[["就","sớm / nhanh / thuận lợi"],["才","muộn / chậm / không dễ"]],"ex":[["他六点就起床了。","Tā liù diǎn jiù qǐ chuáng le.","Anh ấy 6 giờ đã dậy rồi."],["他十点才起床。","Tā shí diǎn cái qǐ chuáng.","Anh ấy 10 giờ mới dậy."],["十五分钟就到。","Shí wǔ fēn zhōng jiù dào.","Chỉ 15 phút là đến."]],"n":["Lưu ý: 就 thường đi với 了 ở cuối câu, còn 才 thì không."]},{"t":"年龄表达法 · Cách hỏi và nói tuổi","r":"Hỏi tuổi trẻ nhỏ: <b>几岁</b>. Hỏi bạn bè, người trẻ: <b>多大</b>. Hỏi người lớn tuổi, lịch sự: <b>多大年纪</b>. Trả lời: số + <b>岁 (suì)</b>.","f":[["Trẻ nhỏ","你几岁？"],["Người trẻ","你多大？"],["Người lớn tuổi","您多大年纪？"]],"ex":[["你今年多大？","Nǐ jīn nián duō dà?","Năm nay bạn bao nhiêu tuổi?"],["我今年二十岁。","Wǒ jīn nián èr shí suì.","Năm nay tôi 20 tuổi."],["你弟弟几岁了？","Nǐ dì di jǐ suì le?","Em trai bạn mấy tuổi rồi?"],["老师多大年纪？","Lǎo shī duō dà nián jì?","Thầy cô bao nhiêu tuổi?"]],"n":["Lưu ý: hỏi tuổi người lớn hoặc người lạ cần dùng cách nói lịch sự (多大年纪)."]}],"20":[{"t":"Tổng kết ngữ pháp đơn nguyên 4 (bài 16 đến bài 19)","r":"Ôn nhanh các điểm ngữ pháp của bài 16 đến bài 19. Mỗi điểm có một câu mẫu.","f":[],"ex":[["今天太冷了。","Jīn tiān tài lěng le.","Hôm nay lạnh quá. (太……了)"],["你来看看。","Nǐ lái kàn kan.","Bạn đến xem thử. (động từ lặp lại)"],["我在宿舍看电视。","Wǒ zài sù shè kàn diàn shì.","Tôi xem ti vi ở ký túc xá. (trạng ngữ nơi chốn)"],["你喝茶还是喝咖啡？","Nǐ hē chá hái shi hē kā fēi?","Bạn uống trà hay uống cà phê? (A还是B)"],["他就是我的老师。","Tā jiù shì wǒ de lǎo shī.","Ông ấy chính là thầy của tôi. (就是)"],["我会说汉语。","Wǒ huì shuō Hàn yǔ.","Tôi biết nói tiếng Hán. (会)"],["看书啦，听音乐啦，他都喜欢。","Kàn shū la, tīng yīn yuè la, tā dōu xǐ huan.","Đọc sách, nghe nhạc, anh ấy đều thích. (列举)"],["我得回宿舍了。","Wǒ děi huí sù shè le.","Tôi phải về ký túc xá rồi. (得 děi)"],["你不是留学生吗？","Nǐ bú shì liú xué shēng ma?","Chẳng phải bạn là lưu học sinh sao? (反问句)"],["如果有时间，我就去。","Rú guǒ yǒu shí jiān, wǒ jiù qù.","Nếu có thời gian thì tôi đi. (如果……就……)"],["他去图书馆了。","Tā qù tú shū guǎn le.","Anh ấy đã đi thư viện rồi. (了)"],["他十点才起床。","Tā shí diǎn cái qǐ chuáng.","Anh ấy 10 giờ mới dậy. (才)"],["你今年多大？","Nǐ jīn nián duō dà?","Năm nay bạn bao nhiêu tuổi? (年龄)"]],"n":["Bài 20 là bài ôn: học sinh dùng các cấu trúc trên để nói về thói quen, kế hoạch và hỏi thăm người khác."]}]};

const tone=s=>/[āēīōūǖ]/.test(s)?1:/[áéíóúǘ]/.test(s)?2:/[ǎěǐǒǔǚ]/.test(s)?3:/[àèìòùǜ]/.test(s)?4:5;
const py=p=>p.split(" ").map(s=>`<span class="t${tone(s)}">${s}</span>`).join(" ");
const say=t=>{try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="zh-CN";u.rate=.8;speechSynthesis.speak(u)}catch(e){}};
const TABS=[["gram","Ngữ pháp"],["dict","Chính tả"],["write","Tập viết"],["build","Ghép âm"],["read","Luyện đọc"],["tr","Dịch câu"],["game","Trò chơi"]];
let tab="dict";
function go(t){tab=t;$("tabs").innerHTML=TABS.map(x=>`<button class="${x[0]===t?"on":""}" data-t="${x[0]}">${x[1]}</button>`).join("");({gram,dict,write,build,read,tr,game})[t]()}

/* ---------- Chính tả ---------- */
let D={mode:"py",q:[],i:0,ok:0,bad:[]};
function dict(){D.q=D.q.length?D.q:shuf(W.slice());drawD()}
function drawD(){
  const head=`<div class="row"><button class="${D.mode==="py"?"on":""}" data-m="py">Viết pinyin</button><button class="${D.mode==="vi"?"on":""}" data-m="vi">Viết nghĩa</button></div>`;
  if(D.i>=D.q.length){$("v").innerHTML=head+`<div class="card"><h2>Xong lượt này</h2><p>Đúng ${D.ok}/${D.q.length} từ.</p><div class="row">${D.bad.length?`<button class="pri" id="rw">Làm lại ${D.bad.length} từ sai</button>`:""}<button id="rs">Làm lại từ đầu</button></div></div>`;
    if(D.bad.length)$("rw").onclick=()=>{D.q=shuf(D.bad.slice());D.bad=[];D.i=0;D.ok=0;drawD()};
    $("rs").onclick=()=>{D.q=shuf(W.slice());D.bad=[];D.i=0;D.ok=0;drawD()};return bindM()}
  const w=D.q[D.i];
  $("v").innerHTML=head+`<div class="mut" style="text-align:center;margin-top:8px">Từ ${D.i+1}/${D.q.length}</div><div class="card"><div class="han">${w[0]}</div><button class="sm" id="sp">Nghe</button>
  <input type="text" id="an" autocomplete="off" autocapitalize="off" placeholder="${D.mode==="py"?"Gõ pinyin, ví dụ: nǐ hǎo":"Gõ nghĩa tiếng Việt"}">
  ${D.mode==="py"?'<div class="row">'+"āáǎà ēéěè īíǐì ōóǒò ūúǔù ü".split(" ").map(g=>[...g].map(c=>`<button class="sm" data-c="${c}">${c}</button>`).join("")).join("")+"</div>":""}
  <div class="row"><button class="pri" id="ck">Kiểm tra</button></div><div id="fb"></div></div>`;
  $("sp").onclick=()=>say(w[0]);bindM();const an=$("an");an.focus();
  document.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{an.value+=b.dataset.c;an.focus()});
  let checked=false;
  const act=()=>{if(checked){D.i++;return drawD()}
    const v=an.value.trim();let ok=false,msg="";
    if(D.mode==="py"){const ex=v.toLowerCase().replace(/\s+/g,"")===w[1].replace(/\s+/g,""),tl=norm(v).replace(/ /g,"")===norm(w[1]).replace(/ /g,"");
      ok=ex;msg=ex?"Đúng hoàn toàn.":tl?"Đúng âm nhưng thanh điệu chưa đúng hoặc còn thiếu.":"Chưa đúng."}
    else{const u=norm(v),segs=w[2].split(/[,;(]/).map(norm).filter(x=>x);ok=u.length>1&&segs.some(s=>s===u||s.includes(u)||u.includes(s));msg=ok?"Đúng.":"Chưa khớp với nghĩa mẫu."}
    if(ok)D.ok++;else D.bad.push(w);checked=true;
    $("fb").innerHTML=`<div class="fb ${ok?"":"no"}"><b>${msg}</b><div>Đáp án: ${py(w[1])} · ${w[2]}</div></div>`;$("ck").textContent="Từ tiếp theo";};
  $("ck").onclick=act;an.onkeydown=e=>{if(e.key==="Enter")act()};
}
function bindM(){document.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{D.mode=b.dataset.m;D.q=shuf(W.slice());D.bad=[];D.i=0;D.ok=0;drawD()})}

function write(){
  const w=W[WI];
  $("v").innerHTML=`<div class="row"><select id="sel">${W.map((x,i)=>`<option value="${i}"${i===WI?" selected":""}>${x[0]} · ${x[2]}</option>`).join("")}</select></div>
  <div class="card">${WS===0?`<div class="mut">Bước 1: tập viết cả từ, từng chữ một</div><div class="big">${py(w[1])}</div><div>${w[2]}</div>
  <div class="boxes" id="bxs">${[...w[0]].map(c=>`<div class="bx"><span>${c}</span><canvas width="260" height="260"></canvas></div>`).join("")}</div>

  :`<div class="mut">Bước 2: học câu có từ vừa viết</div><div class="han" style="font-size:2.2rem;margin-top:8px">${w[3].replace(w[0],`<span class="t3">${w[0]}</span>`)}</div><div class="big">${py(w[1])}</div><div>${w[4]}</div>
  <div class="row"><button id="sp">Nghe câu</button><button class="pri" id="nw">Từ tiếp theo</button></div>`}</div>

  $("sel").onchange=e=>{WI=+e.target.value;WS=0;write()};
  $("sp").onclick=()=>say(WS?w[3]:w[0]);
  if(WS===0){
    document.querySelectorAll(".bx canvas").forEach(cv=>{const x=cv.getContext("2d");let d=false;
      const p=e=>{const r=cv.getBoundingClientRect();return[(e.clientX-r.left)*260/r.width,(e.clientY-r.top)*260/r.height]};
      cv.onpointerdown=e=>{d=true;cv.setPointerCapture(e.pointerId);const[a,b]=p(e);x.strokeStyle=getComputedStyle(document.documentElement).getPropertyValue("--ink");x.lineWidth=9;x.lineCap=x.lineJoin="round";x.beginPath();x.moveTo(a,b);x.lineTo(a+.1,b+.1);x.stroke()};
      cv.onpointermove=e=>{if(!d)return;const[a,b]=p(e);x.lineTo(a,b);x.stroke()};cv.onpointerup=cv.onpointercancel=()=>d=false});
    $("cl").onclick=()=>document.querySelectorAll(".bx canvas").forEach(c=>c.getContext("2d").clearRect(0,0,260,260));
    $("hd").onclick=e=>{const h=document.querySelectorAll(".bx");const on=!h[0].classList.contains("hide");h.forEach(b=>b.classList.toggle("hide",on));e.target.textContent=on?"Hiện chữ mẫu":"Ẩn chữ mẫu"};
    $("nx").onclick=()=>{if(w[3])WS=1;else{WI=(WI+1)%W.length;WS=0}write()};
  }else $("nw").onclick=()=>{WI=(WI+1)%W.length;WS=0;write()};

/* ---------- Ghép âm ---------- */
const INI=["","b","p","m","f","d","t","n","l","g","k","h","j","q","x","zh","ch","sh","r","z","c","s"];
const FIN=["a","o","e","i","u","ü","ai","ei","ao","ou","an","en","ang","eng","ong","ia","ie","iao","iu","ian","in","iang","ing","iong","ua","uo","uai","ui","uan","un","uang","üe","üan","ün"];
const MK={a:"āáǎà",e:"ēéěè",i:"īíǐì",o:"ōóǒò",u:"ūúǔù","ü":"ǖǘǚǜ"};
function spell(i,f){
  if(i==="j"||i==="q"||i==="x")f=f.replace("ü","u");
  if(i==="")f=/^i/.test(f)?(["i","in","ing"].includes(f)?"y"+f:f==="iu"?"you":"y"+f.slice(1)):/^u/.test(f)?(f==="u"?"wu":f==="ui"?"wei":f==="un"?"wen":"w"+f.slice(1)):/^ü/.test(f)?"yu"+f.slice(1):f;
  return i+f}
function mark(s,t){if(t>4)return s;let v=s.includes("a")?"a":s.includes("e")?"e":s.includes("o")?"o":s.includes("iu")?"u":s.includes("ui")?"i":[..."iuü"].filter(c=>s.includes(c)).pop();
  if(!v)return s;const k=s.lastIndexOf(v);return s.slice(0,k)+MK[v][t-1]+s.slice(k+1)}
const compose=(i,f,t)=>mark(spell(i,f),t);
let B={i:"",f:"a",t:1},TG=null;
function build(){
  TG=TG||newT();if(!TG){$("v").innerHTML=`<div class="card"><h2>Chưa có từ phù hợp</h2><p class="mut">Bài này chưa có từ phù hợp cho bài tập ghép âm.</p></div>`;return}
  $("v").innerHTML=`<div class="card"><h2>Ghép đúng âm tiết</h2><div class="mut">Chữ này đọc là gì? Chọn thanh mẫu, vận mẫu và thanh điệu.</div><div class="han">${TG.c}</div><div class="mut">(${TG.w[2]})</div><div class="row"><select id="ti">${INI.map(x=>`<option value="${x}">${x||"(không)"}</option>`).join("")}</select><select id="tf">${FIN.map(x=>`<option>${x}</option>`).join("")}</select><select id="tt">${[1,2,3,4,5].map(x=>`<option value="${x}">${x===5?"thanh nhẹ":"thanh "+x}</option>`).join("")}</select></div>
  <div class="big" id="tr"></div><div class="row"><button class="pri" id="tk">Kiểm tra</button><button id="tn">Chữ khác</button></div><div id="tfb"></div></div>`;
  
  const ut=()=>{const s=compose($("ti").value,$("tf").value,+$("tt").value);$("tr").innerHTML=`<span class="t${tone(s)}">${s}</span>`;return s};
  ["ti","tf","tt"].forEach(i=>$(i).onchange=ut);ut();
  $("tk").onclick=()=>{const s=ut(),ok=s===TG.s;$("tfb").innerHTML=`<div class="fb ${ok?"":"no"}"><b>${ok?"Đúng!":"Chưa đúng."}</b> Đáp án: ${py(TG.s)}</div>`;say(TG.c)};
  $("tn").onclick=()=>{TG=newT();build()};
}
const can=s=>INI.some(i=>FIN.some(f=>[1,2,3,4,5].some(t=>compose(i,f,t)===s)));
function newT(){for(let n=0;n<80;n++){const w=W[Math.floor(Math.random()*W.length)],s=w[1].split(" "),h=[...w[0]];if(/^[\u4e00-\u9fff]+$/.test(w[0])&&h.length===s.length&&s.every(x=>can(x.toLowerCase()))){const k=Math.floor(Math.random()*s.length);return{w,c:h[k],s:s[k].toLowerCase()}}}return null}

/* ---------- Luyện đọc + ghi âm ---------- */
let rec=null,clips={};
function read(){
  const it=[...W.map((w,i)=>["w"+i,w[0],w[1],w[2]]),...W.map((w,i)=>["s"+i,w[3],"",w[4]])];
  $("v").innerHTML=`<div class="mut">Nghe mẫu, bấm ghi âm để đọc, rồi nghe lại bài của bạn. Bản ghi chỉ nằm trên máy này, chưa gửi cho giáo viên.</div><div id="msg" class="fb no" style="display:none"></div>`+
  `<h2>Từ</h2>`+it.filter(x=>x[0][0]==="w").map(row).join("")+(it.some(x=>x[0][0]==="s"&&x[1])?`<h2>Câu</h2>`+it.filter(x=>x[0][0]==="s"&&x[1]).map(row).join(""):"");
  Object.keys(clips).forEach(upd);
}
const row=x=>`<div class="li" id="r${x[0]}"><div><b>${x[1]}</b> ${x[2]?py(x[2]):""}<div class="mut">${x[3]}</div><div class="mut" id="c${x[0]}"></div></div><div class="row" style="margin:0;flex-wrap:nowrap"><button class="sm" data-a="p" data-id="${x[0]}" data-s="${x[1]}">Mẫu</button><button class="sm" data-a="r" data-id="${x[0]}" id="b${x[0]}">Ghi âm</button><button class="sm" data-a="l" data-id="${x[0]}" id="l${x[0]}" disabled>Nghe lại</button></div></div>`;
function upd(id){const l=$("l"+id);if(l)l.disabled=!clips[id]}
document.addEventListener("click",async e=>{const a=e.target.dataset&&e.target.dataset.a;if(!a)return;const id=e.target.dataset.id;
  if(a==="p")return say(e.target.dataset.s);
  if(a==="l"&&clips[id])return new Audio(clips[id]).play();
  if(a==="r"){
    if(rec&&rec.id===id)return rec.m.stop();
    if(rec)return;
    try{const st=await navigator.mediaDevices.getUserMedia({audio:true}),m=new MediaRecorder(st),ch=[];
      m.ondataavailable=ev=>ch.push(ev.data);
      m.onstop=()=>{st.getTracks().forEach(t=>t.stop());clips[id]=URL.createObjectURL(new Blob(ch,{type:m.mimeType}));try{rec.sr&&rec.sr.stop()}catch(x){}rec=null;$("b"+id).textContent="Ghi âm lại";upd(id)};
      m.start();rec={id,m};e.target.textContent="Dừng";const SR=window.SpeechRecognition||window.webkitSpeechRecognition,c=$("c"+id);if(SR&&c){const sr=new SR();sr.lang="zh-CN";c.textContent="Đang nghe...";sr.onresult=ev=>{const t=ev.results[0][0].transcript,tg=document.querySelector("#r"+id+" b").textContent,cl=s=>s.replace(/[^\u4e00-\u9fff]/g,""),a=cl(t),b=cl(tg),n=[...b].filter(ch=>a.includes(ch)).length;c.textContent="Máy nghe được: “"+t+"” · khớp "+Math.round(n/b.length*100)+"% chữ"};sr.onerror=()=>{c.textContent="Máy chưa nhận diện được giọng nói lần này."};try{sr.start();rec.sr=sr}catch(x){}}}
    catch(err){const g=$("msg");g.style.display="block";g.textContent="Không ghi âm được. Hãy cho phép micro cho trang này. Nếu vẫn không được, hãy tải file HTML về và mở bằng Chrome."}
  }});

let TR={n:0,ok:0,pick:[],pool:null,fb:false,res:false};
function tr(){TR={n:0,ok:0,pick:[],pool:null,fb:false,res:false};drawTR()}
function drawTR(){
  const VT=VTD[LS],TV=TVD[LS];if(!VT){$("v").innerHTML=`<div class="card"><h2>Chưa có câu dịch cho bài ${LS}</h2><p class="mut">Đang soạn. Hiện đã có bài 1 đến 20.</p></div>`;return}
  if(TR.n>=10){$("v").innerHTML=`<div class="card"><h2>Xong 10 câu</h2><p>Đúng ${TR.ok}/10 câu.</p><button class="pri" id="rt">Làm lại</button></div>`;return void($("rt").onclick=tr)}
  const v=TR.n<5,k=TR.n%5,head=`<div class="mut" style="text-align:center">Câu ${TR.n+1}/10 · ${v?"Việt → Trung":"Trung → Việt"}</div>`;
  const nxt=()=>{TR.n++;TR.pick=[];TR.pool=null;TR.fb=false;drawTR()};
  if(v){const q=VT[k];if(!TR.pool)TR.pool=shuf(q[1].concat(q[2]));const ans=TR.pick.map(i=>TR.pool[i]).join("");
    $("v").innerHTML=head+`<div class="card"><div class="big">${q[0]}</div><div class="boxes" style="min-height:48px;border-bottom:1px solid var(--ln)">${TR.pick.map((i,j)=>`<button class="pri" data-r="${j}">${TR.pool[i]}</button>`).join("")}</div><div class="boxes">${TR.pool.map((t,i)=>TR.pick.includes(i)?"":`<button data-p="${i}">${t}</button>`).join("")}</div><div class="row"><button class="pri" id="ck2">${TR.fb?"Câu tiếp theo":"Kiểm tra"}</button></div>${TR.fb?`<div class="fb ${TR.res?"":"no"}"><b>${TR.res?"Đúng!":"Chưa đúng."}</b> Đáp án: ${q[1].join("")}</div>`:""}</div>`;
    document.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{if(!TR.fb){TR.pick.push(+b.dataset.p);drawTR()}});
    document.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>{if(!TR.fb){TR.pick.splice(+b.dataset.r,1);drawTR()}});
    $("ck2").onclick=()=>{if(TR.fb)return nxt();TR.res=ans===q[1].join("");if(TR.res)TR.ok++;TR.fb=true;drawTR()};
  }else{const q=TV[k];if(!TR.pool)TR.pool=shuf([q[1]].concat(q[2]));
    $("v").innerHTML=head+`<div class="card"><div class="han" style="font-size:2.4rem">${q[0]}</div><button class="sm" id="sp2">Nghe</button><div class="opts" style="display:grid;gap:8px;margin-top:12px">${TR.pool.map((o,i)=>`<button data-o="${i}">${o}</button>`).join("")}</div>${TR.fb?`<div class="fb ${TR.res?"":"no"}"><b>${TR.res?"Đúng!":"Chưa đúng."}</b> Đáp án: ${q[1]}</div><div class="row"><button class="pri" id="ck2">Câu tiếp theo</button></div>`:""}</div>`;
    $("sp2").onclick=()=>say(q[0]);
    document.querySelectorAll("[data-o]").forEach(b=>b.onclick=()=>{if(TR.fb)return;TR.res=TR.pool[+b.dataset.o]===q[1];if(TR.res)TR.ok++;TR.fb=true;drawTR()});
    if(TR.fb)$("ck2").onclick=nxt;}
}

let G=null;
function game(){G={w:shuf(W.slice()).slice(0,6),m:[],sel:null,t:0,msg:""};G.r=shuf(G.w.slice());drawG()}
function drawG(){const done=G.m.length===6;
  $("v").innerHTML=`<div class="mut" style="text-align:center">Nối chữ Hán với nghĩa · số lần thử: ${G.t}</div><div class="card"><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><div style="display:grid;gap:8px">${G.w.map((w,i)=>`<button class="${G.m.includes(w)?"on":""}" data-gl="${i}" ${G.sel===w?'style="outline:3px solid var(--t4)"':""}>${w[0]}</button>`).join("")}</div><div style="display:grid;gap:8px">${G.r.map((w,i)=>`<button class="${G.m.includes(w)?"on":""}" data-gr="${i}">${w[2]}</button>`).join("")}</div></div><div class="mut" style="margin-top:10px">${done?"Hoàn thành! Bạn nối đúng cả 6 cặp sau "+G.t+" lần thử.":G.msg}</div>${done?'<div class="row"><button class="pri" id="rg">Chơi lại</button></div>':""}</div>`;
  if(done)$("rg").onclick=game;
  document.querySelectorAll("[data-gl]").forEach(b=>b.onclick=()=>{const w=G.w[+b.dataset.gl];if(G.m.includes(w))return;G.sel=w;G.msg="";say(w[0]);drawG()});
  document.querySelectorAll("[data-gr]").forEach(b=>b.onclick=()=>{const w=G.r[+b.dataset.gr];if(!G.sel||G.m.includes(w))return;G.t++;if(w===G.sel){G.m.push(w);G.msg="Đúng rồi!"}else G.msg="Chưa đúng, thử lại.";G.sel=null;drawG()});
}
